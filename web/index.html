<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glinlandui</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      The page IS the window. The toolkit draws every pixel inside the canvas, so
      there is no heading, no footer and no status text in the way: a browser tab
      and a desktop window show the same thing.

      The canvas keeps `tabindex` because the toolkit owns the keyboard once it
      has focus; everything the page adds is either hidden or out of the way.
    -->
    <canvas id="canvas" tabindex="0" aria-label="glinlandui application">
      Your browser does not support the canvas element.
    </canvas>

    <!--
      The app switcher: one link per wasm module `zig build web` installs, filled
      in by `shim.js` from its own list. It stays out of sight until the pointer
      reaches the top edge, the way a desktop app's menu bar does, so the app has
      the whole window until you ask for the menu.
    -->
    <nav id="apps" class="apps" aria-label="examples"></nav>

    <!-- Screen readers read this, and it is where a failure is announced. Never visible. -->
    <p id="status" role="status" class="sr-only">Loading…</p>

    <noscript>
      <p class="error-panel">
        glinlandui is a WebAssembly application and needs JavaScript to load the
        module. Nothing is drawn without it.
      </p>
    </noscript>

    <script type="module" src="shim.js"></script>
  </body>
</html>
