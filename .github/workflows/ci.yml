name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Zig 0.16.0 / native GLES3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install native Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            pkg-config

          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

          test -f vendor/stb/stb/stb_image_resize2.h
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Cross-platform parity test suite (count checked against tests.lock)
        run: ./ci/check_test_parity.sh

      - name: Linux-only native tests (Wayland/EGL/GLES3/Pango)
        run: zig build native-test --summary all

      - name: Build the native executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run the demo (real Wayland window, 3 frames)
        run: env QS_SETTINGS_TEST_FRAMES=3 zig build run

  macos:
    name: macOS / CPU rasterizer / headless pixels
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # macOS has no native Wayland/EGL/GLES client stack. The library selects
      # its portable software rasterizer there and `zig build run` performs a
      # REAL headless render (Clay layout -> rasterizer -> RGBA8 pixels), so
      # this job proves the app genuinely draws without needing a GUI session.
      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Cross-platform parity test suite (count checked against tests.lock)
        run: ./ci/check_test_parity.sh

      - name: Build the CPU-rasterizer executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run the demo (real headless render)
        run: zig build run
