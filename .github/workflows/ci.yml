name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Zig 0.16.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install native Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            pkg-config

          # build.zig historically expects the Arch scanner path. Keep the
          # workflow independent of distro-specific /usr/bin vs /usr/sbin.
          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          # Ubuntu keeps glibconfig.h in the multiarch include directory,
          # while the checked-in build flags mirror the Arch layout.
          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

          # The native renderer resolves the vendored stb headers from
          # vendor/stb, so no distribution stb package is required.
          test -f vendor/stb/stb/stb_image_resize2.h
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf

      - name: Check formatting
        run: >-
          zig fmt --check
          build.zig
          src/root.zig
          src/testing/root.zig
          src/components
          src/wayland/frame.zig
          src/wayland/host.zig
          src/wayland/render.zig
          src/wayland/render_common.zig
          src/wayland/text_backend.zig
          src/wayland/text_portable.zig
          src/wayland_portable.zig
          src/wayland_api.zig

      - name: Run the full native test suite
        run: zig build test --summary all

      - name: Build the native executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run the library smoke test
        run: zig build run

  macos:
    name: macOS / CPU-only Clay surface
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # macOS has no native Wayland/EGL/GLES client stack. The library
      # deliberately selects its CPU-only backend there, so this job runs the
      # same components, frame scheduler, Host, and headless Driver tests
      # without pretending that a Wayland window can be presented.
      - name: Check formatting
        run: >-
          zig fmt --check
          build.zig
          src/root.zig
          src/testing/root.zig
          src/components
          src/wayland/frame.zig
          src/wayland/host.zig
          src/wayland/render.zig
          src/wayland/render_common.zig
          src/wayland/text_backend.zig
          src/wayland/text_portable.zig
          src/wayland_portable.zig
          src/wayland_api.zig

      - name: Run the full macOS test suite
        run: zig build test --summary all

      - name: Build the CPU-only executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run the library smoke test
        run: zig build run
