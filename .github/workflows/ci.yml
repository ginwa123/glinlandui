name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural gate for the core/ + linux/ + mac/ split. Pure grep — no Zig
  # toolchain, no apt — so it is cheap and runs before the build jobs. Rules and
  # rationale: ci/check_layering.sh and REFACTOR_PLAN.md §5.
  layering:
    name: Layering (core / linux / mac)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the core/linux/mac layering rules
        run: ./ci/check_layering.sh

  linux:
    name: Linux / Zig 0.16.0 / native GLES3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install native Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            pkg-config

          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

          test -f vendor/stb/stb/stb_image_resize2.h
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf

      - name: Check formatting
        run: zig fmt --check build.zig src examples

      - name: Cross-platform parity test suite (count checked against tests.lock)
        run: ./ci/check_test_parity.sh

      # native-test is the Linux-only Wayland/EGL/GLES3/Pango superset. The
      # calculator example's tests are NOT here: they are portable, so they
      # run in the parity `test` step above on every platform.
      - name: Linux-only native tests (Wayland/EGL/GLES3/Pango)
        run: zig build native-test --summary all

      - name: Build the native executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run the demo (real Wayland window, 3 frames)
        run: env QS_SETTINGS_TEST_FRAMES=3 zig build run

  macos:
    # The job opens a REAL Cocoa window now (mac/window.zig + mac/shim.m), so
    # this is no longer a "headless pixels" job: it is the macOS peer of the
    # Linux job above, driving the same Clay -> rasterizer -> RGBA8 pipeline
    # through CoreGraphics instead of through a Wayland/EGL swapchain.
    name: macOS / CPU rasterizer / Cocoa window
    runs-on: macos-14
    # Deliberately shorter than the Linux job's 25. A capped Cocoa run that
    # stops exiting is the one regression this job is most exposed to, and it
    # used to burn the full 25 minutes before failing. Fail in 10 instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src examples

      - name: Cross-platform parity test suite (count checked against tests.lock)
        run: ./ci/check_test_parity.sh

      - name: Build the CPU-rasterizer executable (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      # Proves the blit buffer is DISPLAYED as the colour that was written.
      # A wrong `kCGBitmapByteOrder32Little` in mac/shim.m renders the whole
      # window bright red and is invisible to the parity suite; this drives
      # CoreGraphics for real. Needs no window server, so it runs on a stock
      # macOS runner.
      - name: macOS CoreGraphics colour hand-off (displayed == written)
        run: zig build check-colors

      # QS_SETTINGS_TEST_FRAMES caps the run so it terminates on its own, the
      # same way the Linux job above caps its Wayland run. It is NOT optional:
      # with the variable unset the backend is an interactive app, and
      # `[NSApp run]` never returns, so the job would sit here until the
      # timeout instead of failing with something readable.
      #
      # The cap is 1, not 3, and that is the only value Cocoa can honour:
      # AppKit stops redrawing a window once it has been composited, so a
      # larger cap is unreachable and hangs the process. `effectiveMaxFrames`
      # in src/mac/adapter.zig clamps it (and warns) rather than trusting the
      # shim with a number it cannot reach. Running the ReleaseSafe binary
      # built by the previous step also matches the Calculator macOS leg,
      # which is the recipe already proven to work on this runner.
      #
      # The assertions are what turn "it drew something" into a gate. A blank
      # or flat-filled window still paints every pixel, so a plain exit code
      # proves nothing; the non-zero blit checksum is what proves the exact
      # bytes handed to CoreGraphics are not one repeated colour.
      - name: Run the demo (real Cocoa window, one composited frame)
        run: |
          set -euo pipefail

          test -x zig-out/bin/glinlandui

          out="$(env QS_SETTINGS_TEST_FRAMES=1 ./zig-out/bin/glinlandui 2>&1)"
          echo "$out"

          echo "$out" | grep -q 'macOS window:'
          echo "$out" | grep -q 'macOS first frame:'
          painted="$(echo "$out"             | sed -nE 's/.*first frame: [0-9]+x[0-9]+, ([0-9]+) painted pixels.*/\1/p' | head -n1)"
          sum="$(echo "$out"             | sed -nE 's/.*blit checksum 0x([0-9a-f]+).*/\1/p' | head -n1)"

          test -n "$painted"
          test "$painted" -gt 0
          test -n "$sum"
          test "$sum" != "0000000000000000"
          echo "demo painted $painted pixels, blit checksum 0x$sum"

  # Windows is now a full peer: a real Win32 window with a D3D11 swap chain
  # (src/windows/shim.c), a real window backend, and the same parity test count
  # as the other two. It gets its own job because its assertions are different
  # in kind, not just in the numbers: the interesting question on Windows is
  # which presenter actually ran, and the answer is not always D3D11.
  windows:
    name: Windows / Zig 0.16.0 / Win32 + D3D11
    runs-on: windows-2022
    # Deliberately shorter than the Linux job. A Win32 message loop that fails
    # to terminate is the one regression this leg is most exposed to — the
    # first version of this backend hung rather than exiting, and a hung job
    # that burns 25 minutes to time out teaches nobody anything. Fail in 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Windows 2022 runners have no fonts installed by default. The glyph
      # tests no-op without one (so the parity COUNT is unaffected), but a real
      # font is what makes the calculator draw glyphs rather than the per-byte
      # bars the rasterizer falls back to, and it costs nothing to have.
      - name: Confirm a monospace font is present
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in consola.ttf cour.ttf lucon.ttf; do
            if [ -f "/c/Windows/Fonts/$f" ]; then
              echo "font: /c/Windows/Fonts/$f"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::no font from src/windows/text.zig's candidate list is present; text will render as per-byte bars"
          fi

      - name: Check formatting
        run: zig fmt --check build.zig src examples

      - name: Layering rules (core / linux / mac / windows)
        run: ./ci/check_layering.sh

      - name: Cross-platform parity test suite (count checked against tests.lock)
        run: ./ci/check_test_parity.sh

      - name: Build the Win32 + D3D11 executables (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      # Proves the D3D11 colour hand-off for real: the check drives the SAME
      # shader, sampler, draw call and target format the window uses, and
      # compares displayed pixels with written ones. It needs no window, no
      # swap chain and no display, because WARP is a Direct3D 11 software
      # rasterizer — which is the only path available on a hosted runner.
      #
      # It SKIPS (with a reason) on a host that cannot execute a shader at all,
      # which is a real thing on some VMs; it FAILS on a colour mismatch. A
      # green line here means the check ran.
      - name: D3D11 colour hand-off (displayed == written)
        run: zig build check-colors

      # QS_SETTINGS_TEST_FRAMES caps the run so it terminates on its own, the
      # same way the other two legs cap theirs. It is NOT optional: with the
      # variable unset the backend is an interactive app and GetMessage never
      # returns.
      #
      # The assertions are what turn "it opened a window" into a gate. Two
      # things are checked, and which of them applies depends on the machine:
      #
      #   - presenter d3d11: a real swap chain presented the frame. The
      #     non-zero checksum proves the composited bytes are not a flat fill;
      #     a blank window cannot fake it.
      #   - presenter gdi: D3D11 was created but could not present (a driver
      #     that cannot execute a shader), so the shim blitted the same frame
      #     into the window's DC instead. The window is still real and the
      #     pixels are still the ones the CPU rasterizer produced, so the
      #     painted-pixel and checksum assertions apply unchanged. This is the
      #     path a hosted Windows VM takes, and requiring d3d11 there would
      #     mean the leg could only ever pass on a machine with a GPU.
      - name: Run the demo (real Win32 window, one composited frame)
        shell: bash
        run: |
          set -euo pipefail

          test -f zig-out/bin/glinlandui.exe

          out="$(env QS_SETTINGS_TEST_FRAMES=1 ./zig-out/bin/glinlandui.exe 2>&1)"
          echo "$out"

          echo "$out" | grep -q 'Windows window:'
          echo "$out" | grep -q 'Windows first frame:'

          # Read the presenter from the FIRST-FRAME line, never from the
          # window-open line. The two disagree, and that disagreement is the
          # whole point: `run()` logs the presenter as soon as the device is
          # CREATED, and the shim can only find out that it cannot actually
          # present when it presents. A machine whose D3D11 device is
          # real-looking but cannot execute a shader (a hosted VM, for
          # instance) therefore logs `d3d11` and then composites with GDI —
          # and grepping the first line reports a D3D11 pass for a GDI frame.
          # The first-frame line is reported after the present, so it is the
          # authoritative one.
          presenter="$(echo "$out" | sed -nE \
            's/.*first frame: [0-9]+x[0-9]+, [0-9]+ painted pixels, ([a-z0-9]+) upload checksum.*/\1/p' \
            | head -n1)"
          case "$presenter" in
            d3d11) echo "presenter: d3d11 (GPU swap chain)" ;;
            gdi)   echo "presenter: gdi (D3D11 unavailable on this host; CPU blit)" ;;
            *)
              echo "::error::could not read the presenter from the demo's output" >&2
              exit 1
              ;;
          esac

          painted="$(echo "$out" | sed -nE 's/.*first frame: [0-9]+x[0-9]+, ([0-9]+) painted pixels.*/\1/p' | head -n1)"
          sum="$(echo "$out"     | sed -nE 's/.*upload checksum 0x([0-9a-f]+).*/\1/p' | head -n1)"

          test -n "$painted"
          test "$painted" -gt 0
          test -n "$sum"
          test "$sum" != "0000000000000000"
          echo "demo painted $painted pixels, upload checksum 0x$sum (presenter: $presenter)"

  # ---------------------------------------------------------------------------
  # Calculator example (examples/calculator.zig)
  #
  # The example is the reference consumer for the toolkit: a 20-key button
  # grid, indexed click dispatch, and real keyboard input through the Host's
  # KeyChain. It is written against the PUBLIC surface only, so it is not
  # platform-specific: `Window` is the platform indirection. On Linux it is the
  # real Wayland/EGL/GLES3/pangocairo runtime; on macOS the CPU rasterizer
  # behind a real Cocoa window; on Windows the CPU rasterizer behind a real
  # Win32 window composited by D3D11 (or by GDI where the machine has no usable
  # GPU driver). Its 51 tests are part of the cross-platform parity count, so
  # `./ci/check_test_parity.sh` covers the example on all three.
  # ---------------------------------------------------------------------------
  calculator:
    name: Calculator / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux (Wayland/EGL/GLES3/pangocairo)
            expect: present
          - os: macos-14
            label: macOS (portable CPU rasterizer)
            expect: present
          - os: windows-2022
            label: Windows (Win32 window, D3D11 or GDI)
            expect: present
    # Every leg is now a `present` leg and every one of them blocks a merge.
    # There is no longer a platform where the example is expected to be
    # missing, so `continue-on-error` would only be a way to stop noticing.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting (includes examples/)
        run: zig fmt --check build.zig src examples

      # The example links the real native stack, exactly like the main demo.
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            pkg-config

          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

      - name: Report whether the example is wired on this platform
        run: |
          set -uo pipefail
          if zig build --help 2>/dev/null | grep -q 'run-calculator'; then
            echo "run-calculator step: PRESENT"
          else
            echo "run-calculator step: absent"
          fi

      # ---- Linux: the native Wayland/EGL/GLES3/Pango superset. ----
      # `native-test` is Linux-only by construction (it wires the generated
      # protocol C TUs and the pango shim), so it belongs to this leg alone.
      - name: Linux-only native tests (Wayland/EGL/GLES3/Pango)
        if: runner.os == 'Linux'
        run: zig build native-test --summary all

      # ---- The other `present` leg: the example's own tests are portable,
      # so they are part of the parity count and the lock must cover them. ----
      - name: Parity suite (covers the example's 36 tests)
        if: runner.os != 'Linux'
        run: ./ci/check_test_parity.sh

      # ---- present: build it, install it, run it, prove real pixels. ----
      - name: Build and run the calculator
        if: matrix.expect == 'present'
        run: |
          set -euo pipefail

          # `zig build` installs both executables; assert the artifact
          # really exists so a silent regression in the `calc_supported`
          # gate cannot pass this job.
          zig build -Doptimize=ReleaseSafe
          test -x zig-out/bin/glinlandui-calculator
          test -x zig-out/bin/glinlandui

          # QS_SETTINGS_TEST_FRAMES caps the frame count so the run is
          # deterministic and terminates on its own.
          #
          # Linux: no compositor, so Window.run() reports NoWaylandDisplay
          # and the example falls back to a REAL software rasterization.
          #
          # macOS: there IS now a real Cocoa window backend, so the example
          # opens an NSWindow and composites through CGBitmapContext. The
          # backend reports the first composited frame's size, painted-pixel
          # count and a checksum of the exact bytes handed to CoreGraphics.
          # That is the assertion that matters — a screenshot is NOT usable
          # here, because macOS blocks screen capture of an app's own window
          # without Screen Recording permission, so `screencapture` yields a
          # desktop-only image on a stock CI runner.
          out="$(env QS_SETTINGS_TEST_FRAMES=1 WAYLAND_DISPLAY= ./zig-out/bin/glinlandui-calculator 2>&1)"
          echo "$out"

          painted=0
          if echo "$out" | grep -q 'Windows first frame:'; then
            # Windows leg: a real Win32 window, composited by D3D11 or — on a
            # machine whose driver cannot execute a shader — by GDI. Either way
            # the window is real and the bytes are the ones the CPU rasterizer
            # produced, so the same assertions apply. See the `windows` job for
            # the longer version of this argument.
            painted="$(echo "$out" | sed -nE 's/.*first frame: [0-9]+x[0-9]+, ([0-9]+) painted pixels.*/\1/p' | head -n1)"
            sum="$(echo "$out"     | sed -nE 's/.*upload checksum 0x([0-9a-f]+).*/\1/p' | head -n1)"
            test -n "$sum"
            test "$sum" != "0000000000000000"
          elif echo "$out" | grep -q 'headless'; then
            # Linux leg: no compositor, so Window.run() reports NoWaylandDisplay
            # and the example falls back to a REAL software rasterization.
            painted="$(echo "$out" | sed -nE 's/.*\(([0-9]+) painted pixels.*/\1/p' | head -n1)"
          else
            # macOS leg: assert the real window composited a real frame.
            echo "$out" | grep -q 'macOS window:'
            echo "$out" | grep -q 'macOS first frame:'
            painted="$(echo "$out" | sed -nE 's/.*first frame: [0-9]+x[0-9]+, ([0-9]+) painted pixels.*/\1/p' | head -n1)"
            # A non-zero checksum proves the composited bytes are not a flat
            # fill; a blank window cannot fake this.
            sum="$(echo "$out" | sed -nE 's/.*blit checksum 0x([0-9a-f]+).*/\1/p' | head -n1)"
            test -n "$sum"
            test "$sum" != "0000000000000000"
          fi

          test -n "$painted"
          test "$painted" -gt 0
          echo "calculator painted $painted pixels"

  # ---------------------------------------------------------------------------
  # File-dialog example (examples/file_dialog.zig)
  #
  # The "how to use" for `glinlandui.file_dialog`, and the one job whose
  # subject is an API rather than a widget — so what it can honestly assert is
  # worth being precise about before reading the steps.
  #
  # It CANNOT open a real dialog. A file dialog is modal and needs a user, and
  # it needs a portal, and a build machine has neither. A step that tried
  # anyway would not fail — it would sit on a modal window until the job hit
  # its timeout, which is the most expensive way to learn nothing. So the
  # example has a headless mode (`GLIN_FILE_DIALOG_CHECK=1`) that opens no
  # window and no dialog.
  #
  # What that still proves is more than "it compiled":
  #
  #   - the example BUILDS and LINKS against the real backend on each desktop,
  #     which is the part a docs-only change cannot regress;
  #   - `glinlandui.file_dialog.available()` is true on all three;
  #   - a real `openFile` call runs and ends in a NAMED, reported state — a
  #     specific error or a specific status, never a silent success. On a
  #     runner with no session bus that is `NoSessionBus`, and the job asserts
  #     exactly that, so a backend that returned a bogus empty `Selection`
  #     would fail rather than pass.
  #
  # What it does NOT prove is that a portal answers; that needs a desktop, and
  # it is covered by `zig build native-test` against a real bus instead.
  # ---------------------------------------------------------------------------
  file-dialog:
    name: File dialog / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux (XDG portal)
            backend: xdg-desktop-portal
          - os: macos-14
            label: macOS (NSOpenPanel)
            backend: NSOpenPanel
          - os: windows-2022
            label: Windows (IFileDialog)
            backend: IFileDialog
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting (includes examples/)
        run: zig fmt --check build.zig src examples

      # Same native dependency set as every other desktop leg. The example
      # links the real stack — it is a real window — so it needs it.
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fonts-dejavu-core \
            libcairo2-dev \
            libegl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libglib2.0-dev \
            libgles-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libpixman-1-dev \
            libpng-dev \
            libwayland-dev \
            pkg-config

          scanner="$(command -v wayland-scanner)"
          test -n "$scanner"
          sudo ln -sf "$scanner" /usr/sbin/wayland-scanner

          echo "C_INCLUDE_PATH=/usr/lib/$(gcc -print-multiarch)/glib-2.0/include" >> "$GITHUB_ENV"

      - name: Report whether the example is wired on this platform
        run: |
          set -uo pipefail
          if zig build --help 2>/dev/null | grep -q 'run-file-dialog'; then
            echo "run-file-dialog step: PRESENT"
          else
            echo "::error::run-file-dialog step is absent; the example is not wired" >&2
            exit 1
          fi

      # The example's own tests are PORTABLE and are part of the parity count,
      # so `tests.lock` already covers them; nothing extra to run here.
      #
      # What is new is the artifact and the headless probe. Note that the
      # probe writes to STDERR (it uses `std.debug.print`, like every other
      # example in this repository), so `2>&1` is load-bearing rather than
      # decorative — without it the assertions below match nothing and the
      # `test -n` guards turn a silent no-op into a failure.
      - name: Build and probe the file-dialog example
        run: |
          set -euo pipefail

          zig build -Doptimize=ReleaseSafe

          exe="zig-out/bin/glinlandui-file-dialog"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          test -f "$exe"

          out="$(env GLIN_FILE_DIALOG_CHECK=1 XDG_RUNTIME_DIR=/nonexistent "$exe" 2>&1)"
          echo "$out"

          # The backend this build resolved to. Asserting the NAME, not merely
          # that a line exists, is what makes this a check: a build that
          # silently fell back to the portable stub would print
          # "none (error.Unsupported)" and fail here, on macOS and Windows as
          # loudly as on Linux.
          # `${{ matrix.backend }}`, substituted by Actions BEFORE bash sees
          # the script. A bare `$matrix.label` is a SHELL variable, and Actions
          # exports no such thing — under `set -u` that is
          # `matrix: unbound variable`, which is exactly how the first version
          # of this step failed on all three legs with a perfectly correct
          # probe sitting right above it on the log.
          #
          # Into its OWN variable: the first attempt assigned the match back to
          # `$out`, which silently reduced the probe output to one line and
          # broke the two assertions below it. `grep -F` and a `test -n` rather
          # than `grep -q` so the line is visible in the log when it fails.
          backend_line="$(printf '%s\n' "$out" | grep -F "backend:     ${{ matrix.backend }}")"
          test -n "$backend_line"

          # `available()` is what a UI gates its button on, and it is true on
          # all three desktops. A false here means the example silently
          # rendered the "no dialog on this platform" panel instead.
          echo "$out" | grep -q "available:   true"

          # A real `openFile` call must end in a NAMED state. On a runner with
          # no session bus the Linux leg's answer is `NoSessionBus`; macOS and
          # Windows would raise an actual dialog if one could be shown, so
          # they are bounded by the probe's own `timeout_ms` and answer
          # `Timeout`. Either is a specific, reported outcome — and an empty
          # `Selection` claiming success would match neither.
          for probe in open_file open_folder save_file; do
            line="$(printf '%s\n' "$out" | sed -nE "s/^${probe}:[[:space:]]*(.*)\$/\1/p" | head -n1)"
            test -n "$line"
            case "$line" in
              *NoSessionBus|*NoPortal|*PortalError|*Timeout|*cancelled|*other|*selected)
                ;;
              *)
                echo "::error::${probe} ended in an unnamed state: ${line}" >&2
                exit 1
                ;;
            esac
          done

          echo "file-dialog: example built, backend resolved, all three probes reported a named state"

  # ---------------------------------------------------------------------------
  # Browser backend (WebAssembly).
  #
  # `zig build web` and `zig build web-calculator` produce `zig-out/web/`, and
  # `web/smoke.mjs` drives both modules through their real ABI in Node — no
  # browser, no headless Chrome, no npm, no `apt-get install`. That last absence
  # is itself the assertion: a `wasm32-freestanding` module needs no system
  # libraries at all, which is why this job installs nothing.
  #
  # What it checks is the web peer of the macOS job's CoreGraphics colour check.
  # That job exists because a green parity suite could not catch a wrong
  # `kCGBitmapInfo` in the shim; this one exists because a browser's canvas, DOM
  # and `requestAnimationFrame` are equally unreachable from a Zig test. It closes
  # the gap WITHOUT a browser by driving the real modules end to end and asserting
  # on real pixels:
  #
  #   - each module's import section is EMPTY (nothing stubbed, nothing borrowed)
  #   - `src/web/shim.h` matches the module's actual exports, both directions
  #   - a frame paints non-zero pixels and is not a flat fill
  #   - the dirty-flag contract holds (the idle-CPU guarantee)
  #   - the EMBEDDED FONT installed, asserted twice: by `glin_web_font_error()`
  #     being 0, and by the title band containing antialiased text rather than the
  #     glyph-free bar fallback. The second is the one that matters — a flag can
  #     be wrong, pixels cannot. This is the check that would have caught the
  #     install-before-window bug that made the browser draw bars for a long time
  #     while every other assertion here passed.
  #   - a synthesised click CHANGES the frame, because the demo draws its own
  #     click count — so the whole chain from DOM-shaped coordinates to the app
  #     callback is covered, not merely "the code ran"
  #   - the calculator's KEYBOARD works: `7 + 8 =` typed through the keymap
  #     changes its display, which exercises `web/keymap.zig` -> the Host's
  #     KeyChain -> the app's `onKey` -> the re-render
  # ---------------------------------------------------------------------------
  web:
    name: Web / WebAssembly / canvas (no browser, no npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check formatting
        run: zig fmt --check build.zig src examples

      # No `apt-get` step, deliberately. The wasm build is the one artifact in
      # this repository that needs no system library — no Wayland, no EGL, no
      # pango, no libc — and a job that quietly installed them would hide a
      # regression that reintroduced the dependency.
      - name: Build the browser webapp (demo)
        run: zig build web -Doptimize=ReleaseSafe

      - name: Build the browser webapp (calculator)
        run: zig build web-calculator -Doptimize=ReleaseSafe

      - name: Assert the artifact is a complete, servable site
        run: |
          set -euo pipefail
          test -s zig-out/web/glinlandui.wasm
          test -s zig-out/web/glinlandui-calculator.wasm
          for f in index.html shim.js style.css; do
            test -s "zig-out/web/$f" || { echo "::error::missing zig-out/web/$f" >&2; exit 1; }
          done
          echo "demo:       $(wc -c < zig-out/web/glinlandui.wasm) bytes"
          echo "calculator: $(wc -c < zig-out/web/glinlandui-calculator.wasm) bytes"

      - name: Drive both modules through their ABI
        run: node web/smoke.mjs

      # The `-Dweb` flag is what `zig build run-calculator -Dweb` uses, and it is
      # a BUILD option rather than a runtime one because the target is a
      # compile-time property. This step proves the flag is wired: it must build
      # the wasm artifact and print the URL. It does NOT leave a server running —
      # the step is capped and its output is checked, not its lifetime.
      #
      # NOTE: the flag is `-Dweb`, NOT `--web`. `zig build` has its own built-in
      # `--webui` flag and parses `--web` as an abbreviation of that, so `--web`
      # silently does nothing. That cost an hour once; this step is what stops it
      # happening again.
      - name: The -Dweb flag builds and prints the URL
        run: |
          set -euo pipefail
          out="$(timeout 20 zig build run-calculator -Dweb 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q 'serving zig-out/web'
          echo "$out" | grep -q 'http://localhost:8080/?app=calculator'
          echo "-Dweb: builds, serves, prints the URL"
